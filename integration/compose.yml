# The integration stack: a real HappyView running this repo's lexicons and
# scripts, with real accounts in a dummy PLC directory and PDS, and fakes for
# the two things the scripts call out to.
#
# Modelled on HappyView's docker-compose.e2e.yml (origin/alpha), minus Caddy:
# nothing here signs in through a PDS OAuth screen, so nothing needs TLS.
# Sessions are signed cookies instead (see session.ts).
#
#   docker compose -f integration/compose.yml up -d --wait
#   bun run gen && bun run test:integration
#   docker compose -f integration/compose.yml down -v
#
# Host ports sit in the 55xxx range so the stack does not collide with
# HappyView's own dev, test and e2e stacks (5432-5434, 2582, 3100, 3200).
# Ports bind to loopback only: the stack runs with known secrets.
# The HappyView release and every image digest come from .env beside this file.
name: happyproto-lexicons-integration

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set in integration/.env}
    environment:
      POSTGRES_USER: happyview
      POSTGRES_PASSWORD: happyview
      POSTGRES_DB: happyview
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happyview -d happyview"]
      interval: 2s
      timeout: 5s
      retries: 30

  plc:
    image: ${PLC_IMAGE:?set in integration/.env}
    environment:
      DB_CREDS_JSON: '{"username":"happyview","password":"happyview","host":"postgres","port":"5432","database":"plc"}'
      ENABLE_MIGRATIONS: "true"
      DB_MIGRATE_CREDS_JSON: '{"username":"happyview","password":"happyview","host":"postgres","port":"5432","database":"plc"}'
      PORT: "2582"
    ports:
      - "127.0.0.1:55582:2582"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2582/_health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  pds:
    # Distroless, so it has no healthcheck; setup.ts waits for /health.
    image: ${PDS_IMAGE:?set in integration/.env}
    environment:
      DATABASE_URL: postgres://happyview:happyview@postgres:5432/pds
      PLC_DIRECTORY_URL: http://plc:2582
      TRANQUIL_PDS_ALLOW_INSECURE_SECRETS: "1"
      DISABLE_RATE_LIMITING: "true"
      DISABLE_ACCOUNT_VERIFICATION_GATE: "true"
    volumes:
      - ./pds-config.toml:/etc/tranquil-pds/config.toml:ro
    ports:
      - "127.0.0.1:55100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      plc:
        condition: service_healthy

  happyview:
    image: ghcr.io/gamesgamesgamesgamesgames/happyview:${HAPPYVIEW_VERSION:?set in integration/.env}
    # PLUGIN_URLS is built from plugins.txt, the one list of plugins the
    # infrastructure repo copies, so the two cannot drift.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PLUGIN_URLS="$$(grep -v '^#' /plugins.txt | grep . | tr '\n' ',' | sed 's/,$$//')"
        exec /entrypoint.sh
    environment:
      DATABASE_URL: postgres://happyview:happyview@postgres:5432/happyview
      PUBLIC_URL: http://127.0.0.1:55200
      HOST: 0.0.0.0
      PORT: "3000"
      PLC_URL: http://plc:2582
      RELAY_URL: http://plc:2582
      SESSION_SECRET: e2e-test-secret-that-is-at-least-32-bytes
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JETSTREAM_URL: ws://127.0.0.1:9
      # Closed ports: the stack never subscribes to the live network or sends
      # telemetry to the production collector.
      TELEMETRY_COLLECTOR_URL: http://127.0.0.1:9/v1/snapshot
      FEATURE_SPACES_ENABLED: "true"
      JOB_WORKER_CONCURRENCY: "4"
    volumes:
      - ./plugins.txt:/plugins.txt:ro
    ports:
      - "127.0.0.1:55200:3000"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      plc:
        condition: service_healthy

  fake-provisioner:
    image: ${BUN_IMAGE:?set in integration/.env}
    working_dir: /app
    command: ["bun", "run", "fake-provisioner.ts"]
    environment:
      PORT: "8080"
      PROVISIONER_TOKEN: integration-provisioner-token
    volumes:
      - ./fake-provisioner.ts:/app/fake-provisioner.ts:ro
    ports:
      - "127.0.0.1:55300:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8080/__health')).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  fake-clickhouse:
    image: ${BUN_IMAGE:?set in integration/.env}
    working_dir: /app
    command: ["bun", "run", "fake-clickhouse.ts"]
    environment:
      PORT: "8123"
    volumes:
      - ./fake-clickhouse.ts:/app/fake-clickhouse.ts:ro
    ports:
      - "127.0.0.1:55400:8123"
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8123/__health')).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
