name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Generate ONCE and pass the output downstream. Generating separately in each
  # job would have lint verifying one set of bytes and deploy uploading another
  # that merely ought to be identical.
  build:
    name: Build
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # luac -p syntax-checks every generated script, and lua5.4 runs the
      # prelude's unit tests. Without Lua installed those tests FAIL rather
      # than skipping, so a runner missing it is visible instead of quietly
      # checking nothing.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: bun install --frozen-lockfile
      # gen BEFORE test: lua/ is build output and is not in the repo, so on a
      # fresh checkout the tests that inspect generated scripts have nothing to
      # read. Generation does not depend on the tests; the tests depend on it.
      - run: bun run gen
      - run: bun test
      # Second of three fail-loud guards: the generator already exits non-zero
      # on a zero-file run, this catches an empty upload, and download-artifact
      # below errors on a missing artifact. Artifacts rather than actions/cache
      # deliberately -- a cache miss is SILENT, and lint would then pass having
      # linted lexicons/ alone: green, intermittent, and worthless.
      - uses: actions/upload-artifact@v4
        with:
          name: lua
          path: lua/
          if-no-files-found: error

  lint:
    name: Lint
    needs: build
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      - uses: gamesgamesgamesgamesgames/happyview-actions/lint@v1
        with:
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua

  # The scripts on a real HappyView, at the release production runs, with
  # real accounts and spaces and fakes for the provisioner and ClickHouse.
  # See integration/compose.yml. Generates its own lua/ rather than taking
  # the build artifact, because the stack has to be up first anyway and gen
  # takes a second.
  integration:
    name: Integration
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: docker compose -f integration/compose.yml up -d --wait
      - run: bun run gen
      - run: bun run test:integration
      - name: Stack logs
        if: failure()
        run: docker compose -f integration/compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f integration/compose.yml down -v

  plan:
    name: Plan (dry run)
    # On a pull request, show what WOULD change without writing anything.
    # A lint pass proves the files are well-formed; it does not tell you which
    # lexicons and scripts a merge would actually replace.
    if: github.event_name == 'pull_request'
    needs: [build, lint]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      - uses: gamesgamesgamesgamesgames/happyview-actions/deploy@v1
        with:
          happyview-url: ${{ vars.HAPPYVIEW_URL }}
          api-key: ${{ secrets.HAPPYVIEW_API_KEY }}
          # vendor/lexicons are upstream's: deployed so the registry can index
          # them, but lexicon-publish below reads only lexicons/.
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          # Jobs are generated into lua/jobs/ and must not also be taken for
          # route or record scripts, which would look for a lexicon to pair.
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua
          # prune with dry-run writes nothing: it only adds a
          # "would prune lexicon <nsid>" line per remote item this branch no
          # longer contains. Without it a PR plan shows what a merge would
          # replace but not what it would DELETE, which is the half that
          # cannot be undone.
          prune: "true"
          dry-run: "true"
      # Which schemas a merge would publish, and whether every authority's
      # _lexicon DNS still names the account. One step per account in
      # scripts/publishing.ts.
      - uses: happyproto/actions/lexicon-publish@v1
        with:
          identifier: happyproto.at
          exclude: dev.happyview
          dry-run: "true"
      - uses: happyproto/actions/lexicon-publish@v1
        with:
          identifier: did:plc:qneu5uamqs6cug7sjobbaexm
          include: dev.happyview
          dry-run: "true"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, lint, integration]
    runs-on: depot-ubuntu-24.04
    environment: production
    # Counted by the dry run below, read by the prune job.
    outputs:
      prunable-lexicons: ${{ steps.prune-plan.outputs.lexicons-pruned }}
      prunable-scripts: ${{ steps.prune-plan.outputs.scripts-pruned }}
    # One deploy at a time. Two concurrent runs would race each other's
    # uploads against the same instance, and the loser would win. Scoped to
    # this job, so pull-request runs never queue in it: a PR can neither hold
    # up nor displace a pending deploy from main.
    concurrency:
      group: happyview-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      # What a prune WOULD remove, named one per line in this step's log, and
      # counted into this job's outputs. Writes nothing -- dry-run makes every
      # upsert and delete a log line -- so it is safe on the deploy path and
      # runs on every push, whether or not pruning is enabled.
      - name: Plan what a prune would remove
        uses: gamesgamesgamesgamesgames/happyview-actions/deploy@v1
        id: prune-plan
        with:
          happyview-url: ${{ vars.HAPPYVIEW_URL }}
          api-key: ${{ secrets.HAPPYVIEW_API_KEY }}
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua
          prune: "true"
          dry-run: "true"

      - uses: gamesgamesgamesgamesgames/happyview-actions/deploy@v1
        id: deploy
        with:
          happyview-url: ${{ vars.HAPPYVIEW_URL }}
          api-key: ${{ secrets.HAPPYVIEW_API_KEY }}
          # vendor/lexicons are upstream's: deployed so the registry can index
          # them, but lexicon-publish below reads only lexicons/.
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          # Jobs are generated into lua/jobs/ and must not also be taken for
          # route or record scripts, which would look for a lexicon to pair.
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua
          # Still OFF here. Deleting a lexicon or script is the one deploy
          # action that cannot be undone by pushing a fix -- for a record-type
          # lexicon it also orphans the records indexed under it -- so it does
          # not ride along with an ordinary deploy. The prune job below does
          # it, once someone has read the dry run above and approved.
          prune: "false"

      - name: Summarise
        run: |
          {
            echo "### Deployed to \`${{ vars.HAPPYVIEW_URL }}\`"
            echo ""
            echo "| what | count |"
            echo "| --- | --- |"
            echo "| lexicons | ${{ steps.deploy.outputs.lexicons-deployed }} |"
            echo "| scripts | ${{ steps.deploy.outputs.scripts-deployed }} |"
            echo "| jobs | ${{ steps.deploy.outputs.jobs-deployed }} |"
            echo "| labelers | ${{ steps.deploy.outputs.labelers-deployed }} |"
            echo "| errors | ${{ steps.deploy.outputs.errors }} |"
            echo ""
            echo "Prune would remove ${{ steps.prune-plan.outputs.lexicons-pruned }} lexicon(s) and ${{ steps.prune-plan.outputs.scripts-pruned }} script(s)."
            echo "See the \"Plan what a prune would remove\" step's log for the names. Nothing is deleted without approving the Prune job."
          } >> "$GITHUB_STEP_SUMMARY"

  # Deleting what the repo no longer contains. Separate from deploy, and
  # off unless two things are true, because this is the only irreversible
  # step in the pipeline:
  #
  #   - HAPPYVIEW_ALLOW_PRUNE must be "true" as a repository variable. Merging
  #     this workflow therefore cannot itself delete anything: an unset
  #     variable is not "true", so the job is skipped. Unset it to disarm
  #     pruning again without reverting the workflow.
  #   - the production-prune environment gates the run. Give it a required
  #     reviewer and GitHub holds the job until someone approves it, with the
  #     dry run from the deploy job already in the log above.
  #
  # Both are deliberate, and the job is skipped entirely when the dry run
  # found nothing to remove, so an ordinary deploy never asks for a click.
  #
  # The action upserts as well as prunes, so an approved run re-uploads the
  # same files the deploy job just uploaded before deleting the absent ones.
  # That is idempotent, and it keeps the prune reading one consistent view of
  # the repo rather than a half-applied one.
  prune:
    name: Prune
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && vars.HAPPYVIEW_ALLOW_PRUNE == 'true'
      && (needs.deploy.outputs.prunable-lexicons != '0'
          || needs.deploy.outputs.prunable-scripts != '0')
    needs: deploy
    runs-on: depot-ubuntu-24.04
    environment: production-prune
    # Shares the deploy group: a prune awaiting approval must not run while a
    # later push is mid-deploy, or it would delete against one repo state
    # having been planned against another.
    concurrency:
      group: happyview-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      - uses: gamesgamesgamesgamesgames/happyview-actions/deploy@v1
        id: prune
        with:
          happyview-url: ${{ vars.HAPPYVIEW_URL }}
          api-key: ${{ secrets.HAPPYVIEW_API_KEY }}
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua
          prune: "true"
          dry-run: "false"

      - name: Summarise
        run: |
          {
            echo "### Pruned \`${{ vars.HAPPYVIEW_URL }}\`"
            echo ""
            echo "| what | count |"
            echo "| --- | --- |"
            echo "| lexicons deleted | ${{ steps.prune.outputs.lexicons-pruned }} |"
            echo "| scripts deleted | ${{ steps.prune.outputs.scripts-pruned }} |"
            echo "| errors | ${{ steps.prune.outputs.errors }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The lexicons as com.atproto.lexicon.schema records in their owners' repos,
  # found through _lexicon.<authority> DNS, so a PDS that resolves lexicons
  # can validate a registry record or expand a permission set. After the
  # deploy, so the instance never serves a schema the network has not seen
  # published.
  #
  # One entry per account, mirroring scripts/publishing.ts. Each selects its
  # own share of lexicons/ with include and exclude and publishes it with its
  # own app password. lexicon-publish also refuses any selected NSID whose DNS
  # names another account, so no lexicon can land in the wrong repo.
  publish-lexicons:
    name: Publish lexicons (${{ matrix.account }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: depot-ubuntu-24.04
    environment: production
    strategy:
      # The prefixes are named so they can't be mistaken for the matrix's own
      # include and exclude keys.
      #
      # One account's failure, such as an expired app password, must not
      # stop the other's publish.
      fail-fast: false
      matrix:
        include:
          - account: happyproto.at
            identifier: happyproto.at
            include-prefixes: ""
            exclude-prefixes: dev.happyview
            secret: LEXICON_APP_PASSWORD
          - account: happyview.dev
            identifier: did:plc:qneu5uamqs6cug7sjobbaexm
            include-prefixes: dev.happyview
            exclude-prefixes: ""
            secret: HAPPYVIEW_DEV_LEXICON_APP_PASSWORD
    steps:
      - uses: actions/checkout@v7
      - uses: happyproto/actions/lexicon-publish@v1
        with:
          identifier: ${{ matrix.identifier }}
          include: ${{ matrix.include-prefixes }}
          exclude: ${{ matrix.exclude-prefixes }}
          password: ${{ secrets[matrix.secret] }}
