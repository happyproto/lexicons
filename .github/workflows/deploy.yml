name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Generate ONCE and pass the output downstream. Generating separately in each
  # job would have lint verifying one set of bytes and deploy uploading another
  # that merely ought to be identical.
  build:
    name: Build
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # luac -p syntax-checks every generated script, and lua5.4 runs the
      # prelude's unit tests. Without Lua installed those tests FAIL rather
      # than skipping, so a runner missing it is visible instead of quietly
      # checking nothing.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: bun install --frozen-lockfile
      # gen BEFORE test: lua/ is build output and is not in the repo, so on a
      # fresh checkout the tests that inspect generated scripts have nothing to
      # read. Generation does not depend on the tests; the tests depend on it.
      - run: bun run gen
      - run: bun test
      # Second of three fail-loud guards: the generator already exits non-zero
      # on a zero-file run, this catches an empty upload, and download-artifact
      # below errors on a missing artifact. Artifacts rather than actions/cache
      # deliberately -- a cache miss is SILENT, and lint would then pass having
      # linted lexicons/ alone: green, intermittent, and worthless.
      - uses: actions/upload-artifact@v4
        with:
          name: lua
          path: lua/
          if-no-files-found: error

  lint:
    name: Lint
    needs: build
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      - uses: gamesgamesgamesgamesgames/happyview-actions/lint@v1
        with:
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua

  # The scripts on a real HappyView, at the release production runs, with
  # real accounts and spaces and fakes for the provisioner and ClickHouse.
  # See integration/compose.yml. Generates its own lua/ rather than taking
  # the build artifact, because the stack has to be up first anyway and gen
  # takes a second.
  integration:
    name: Integration
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: docker compose -f integration/compose.yml up -d --wait
      - run: bun run gen
      - run: bun run test:integration
      - name: Stack logs
        if: failure()
        run: docker compose -f integration/compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f integration/compose.yml down -v

  plan:
    name: Plan (dry run)
    # On a pull request, show what WOULD change without writing anything.
    # A lint pass proves the files are well-formed; it does not tell you which
    # lexicons and scripts a merge would actually replace.
    if: github.event_name == 'pull_request'
    needs: [build, lint]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      - uses: gamesgamesgamesgamesgames/happyview-actions/deploy@v1
        with:
          happyview-url: ${{ vars.HAPPYVIEW_URL }}
          api-key: ${{ secrets.HAPPYVIEW_API_KEY }}
          # vendor/lexicons are upstream's: deployed so the registry can index
          # them, but lexicon-publish below reads only lexicons/.
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          # Jobs are generated into lua/jobs/ and must not also be taken for
          # route or record scripts, which would look for a lexicon to pair.
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua
          dry-run: "true"
      # Which schemas a merge would publish, and whether every authority's
      # _lexicon DNS still names the account.
      - uses: happyproto/actions/lexicon-publish@v1
        with:
          identifier: happyproto.at
          dry-run: "true"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, lint, integration]
    runs-on: depot-ubuntu-24.04
    environment: production
    # One deploy at a time. Two concurrent runs would race each other's
    # uploads against the same instance, and the loser would win. Scoped to
    # this job, so pull-request runs never queue in it: a PR can neither hold
    # up nor displace a pending deploy from main.
    concurrency:
      group: happyview-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: lua
          path: lua/
      - uses: gamesgamesgamesgamesgames/happyview-actions/deploy@v1
        id: deploy
        with:
          happyview-url: ${{ vars.HAPPYVIEW_URL }}
          api-key: ${{ secrets.HAPPYVIEW_API_KEY }}
          # vendor/lexicons are upstream's: deployed so the registry can index
          # them, but lexicon-publish below reads only lexicons/.
          lexicons: |
            lexicons/**/*.json
            vendor/lexicons/**/*.json
          # Jobs are generated into lua/jobs/ and must not also be taken for
          # route or record scripts, which would look for a lexicon to pair.
          scripts: |
            lua/**/*.lua
            !lua/jobs/**
          jobs: lua/jobs/**/*.lua
          # prune is deliberately OFF. Turning it on makes a deleted file
          # delete live lexicons and scripts, which for a record-type lexicon
          # also orphans indexed data. Delete deliberately, by hand, until
          # there is a reason to automate it.
          prune: "false"

      - name: Summarise
        run: |
          {
            echo "### Deployed to \`${{ vars.HAPPYVIEW_URL }}\`"
            echo ""
            echo "| what | count |"
            echo "| --- | --- |"
            echo "| lexicons | ${{ steps.deploy.outputs.lexicons-deployed }} |"
            echo "| scripts | ${{ steps.deploy.outputs.scripts-deployed }} |"
            echo "| jobs | ${{ steps.deploy.outputs.jobs-deployed }} |"
            echo "| labelers | ${{ steps.deploy.outputs.labelers-deployed }} |"
            echo "| errors | ${{ steps.deploy.outputs.errors }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The lexicons as com.atproto.lexicon.schema records in HappyProto's repo,
  # found through _lexicon.<authority> DNS, so a PDS that resolves lexicons
  # can validate a registry record against them. After the deploy, so the
  # instance never serves a schema the network has not seen published.
  publish-lexicons:
    name: Publish lexicons
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: depot-ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: happyproto/actions/lexicon-publish@v1
        with:
          identifier: happyproto.at
          password: ${{ secrets.LEXICON_APP_PASSWORD }}
